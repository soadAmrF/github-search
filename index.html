<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-light min-vh-100 d-flex flex-column align-items-center justify-content-center py-5"
  >
    <div
      class="container d-flex flex-column align-items-center"
      style="max-width: 600px"
    >
      <div
        class="bg-dark rounded-circle mb-3"
        style="width: 60px; height: 60px"
      ></div>

      <h1 class="fw-bold fs-2 mb-1">GitHub User Finder</h1>
      <p class="text-muted mb-4">
        Search for any GitHub user by their username
      </p>

      <div class="card border-0 shadow-sm p-3 rounded-4 w-100 mb-4">
        <div class="input-group">
          <input
            id="inp"
            type="text"
            class="form-control border-0 shadow-none fs-6 py-2"
            placeholder="Enter GitHub username..."
          />
          <button id="btn" class="btn btn-primary px-4 rounded-3" type="button">
            Show
          </button>
        </div>
      </div>
      <div
        id="loading"
        class="text-primary fw-bold text-center mb-3 d-none"
      ></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
